[package]
name = "my-web-server"
version = "0.4.1"
edition = "2021"
authors = ["Alice <alice@example.com>"]
description = "A lightweight HTTP server"

[dependencies]
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "server"
path = "src/main.rs"
