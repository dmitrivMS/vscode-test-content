[server]
host = 0.0.0.0
port = 8080
workers = 4
debug = false

[database]
engine = postgresql
host = db.internal.local
port = 5432
name = appdata
user = app_service
password_file = /run/secrets/db_password
pool_size = 20
ssl_mode = require

[logging]
level = INFO
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
file = /var/log/app/server.log
max_bytes = 10485760
backup_count = 5
