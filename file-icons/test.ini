[general]
app_name = MyApplication
version = 2.4.1
debug = false
log_level = warning

[database]
host = localhost
port = 5432
name = myapp_production
user = dbadmin
max_connections = 25
timeout = 30

[cache]
enabled = true
backend = redis
host = 127.0.0.1
port = 6379
ttl = 3600

[email]
smtp_host = smtp.example.com
smtp_port = 587
use_tls = true
from_address = noreply@example.com
